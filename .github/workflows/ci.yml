name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write # required by the release job to create GitHub releases

jobs:
  # ---------------------------------------------------------------------------
  # Lint + tests on Linux. All deps are public (PyPI), so no auth is needed.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Run tests
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Freeze the connector into a single Windows .exe (proven PyInstaller recipe),
  # then smoke-test that the frozen exe actually boots in simulator mode and
  # serves both the SiLA gRPC port and the Prometheus /metrics endpoint.
  # ---------------------------------------------------------------------------
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Build relay-connector.exe
        run: >
          uv run --with pyinstaller pyinstaller --onefile --name relay-connector
          --collect-all grpc
          --collect-all unitelabs
          --collect-submodules google.protobuf
          --collect-submodules serial
          --copy-metadata grpcio
          --copy-metadata unitelabs-cdk
          --copy-metadata pyserial
          packaging/relay_forwarder.py

      - name: Smoke test - frozen exe boots in simulator mode
        shell: pwsh
        run: |
          $exe = "dist/relay-connector.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          # Use 127.0.0.1 (not localhost): the server binds IPv4 0.0.0.0, and on
          # Windows "localhost" can resolve to IPv6 ::1 first.
          $proc = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput boot.out.log -RedirectStandardError boot.err.log
          $metrics = $null
          $silaUp = $false
          # --onefile cold start unpacks to %TEMP% then imports grpc/cdk; allow generous time.
          # All live probes happen here, while the process is still running.
          foreach ($i in 1..90) {
            if ($proc.HasExited) { break }
            if ($null -eq $metrics) {
              try {
                $metrics = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:9110/metrics).Content
              } catch { }
            }
            if ($metrics -ne $null -and -not $silaUp) {
              # The SiLA gRPC server starts just after create_app yields.
              $r = Test-NetConnection -ComputerName 127.0.0.1 -Port 50051 -WarningAction SilentlyContinue
              if ($r.TcpTestSucceeded) { $silaUp = $true }
            }
            if ($metrics -ne $null -and $silaUp) { break }
            Start-Sleep -Seconds 1
          }
          $exited = $proc.HasExited
          $code = if ($exited) { $proc.ExitCode } else { "n/a" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1  # let redirected log handles flush/release
          if ($null -eq $metrics -or -not $silaUp) {
            Write-Host "HasExited=$exited ExitCode=$code metricsServed=$($metrics -ne $null) silaUp=$silaUp"
            Write-Host "--- stdout ---"; Get-Content boot.out.log -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content boot.err.log -ErrorAction SilentlyContinue
            throw "relay-connector.exe did not fully boot (metrics 9110 + SiLA 50051) within 90s"
          }
          if ($metrics -notmatch "sila_server_info") { throw "sila_server_info metric missing" }
          if ($metrics -notmatch "relay_active_channel") { throw "relay_active_channel metric missing" }
          Write-Host "Smoke test passed: exe booted in simulator mode; /metrics + SiLA 50051 reachable."

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/relay-connector.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  relay-connector.exe" | Out-File -Encoding ascii dist/relay-connector.exe.sha256
          Write-Host "sha256: $hash"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-connector-exe
          path: |
            dist/relay-connector.exe
            dist/relay-connector.exe.sha256
          retention-days: 14

  # ---------------------------------------------------------------------------
  # On a semver tag (vX.Y.Z), publish an immutable GitHub release with the exe
  # and its sha256. The Nomad deploy pins this asset URL + sha256.
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: relay-connector-exe
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/relay-connector.exe
          dist/relay-connector.exe.sha256
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
